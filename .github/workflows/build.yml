name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract archive and prepare files
        run: |
          mkdir -p /tmp/game_files
          ZIP_NAME=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          unzip -q -o "$ZIP_NAME" -d /tmp/game_files/
          
          # Если внутри папка TechEmpireTycoon, переносим всё в корень
          if [ -d "/tmp/game_files/TechEmpireTycoon" ]; then
            cp -r /tmp/game_files/TechEmpireTycoon/* .
          else
            cp -r /tmp/game_files/* .
          fi
          rm -rf /tmp/game_files

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Make gradlew and build
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechEmpireTycoon-APK
          path: app/build/outputs/apk/debug/*.apk
