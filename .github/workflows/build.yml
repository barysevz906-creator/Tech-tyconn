name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract archive
        run: |
          mkdir -p extracted
          find . -maxdepth 1 -name "*.zip" -exec unzip -q -o {} -d extracted/ \;
          
          # Если файлы внутри TechEmpireTycoon, переносим в корень
          if [ -d "extracted/TechEmpireTycoon" ]; then
            cp -r extracted/TechEmpireTycoon/* .
          else
            cp -r extracted/* .
          fi
          rm -rf extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechEmpireTycoon-APK
          path: "**/build/outputs/apk/debug/*.apk"
