name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          unzip -q -o "$ZIP_FILE" -d extracted/
          
          # Если внутри папка с проектом, вытаскиваем всё в корень
          if [ -d "extracted/TechEmpireTycoon_project" ]; then
            cp -r extracted/TechEmpireTycoon_project/* .
          else
            cp -r extracted/* .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechEmpireTycoon-APK
          path: "**/build/outputs/apk/debug/*.apk"
