name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract archive
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q -o "$ZIP_FILE" -d extracted/
          fi
          if [ -d "extracted/TechEmpireTycoon_project" ]; then
            cp -r extracted/TechEmpireTycoon_project/* .
          elif [ -n "$ZIP_FILE" ]; then
            cp -r extracted/* .
          fi
          chmod +x gradlew || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechEmpireTycoon-APK
          path: "**/build/outputs/apk/debug/*.apk"
